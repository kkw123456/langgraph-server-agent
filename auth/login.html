<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · LangGraph 智能体</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand: #18a058;
      --brand-dark: #128c4a;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f5f7fa;
      --danger: #d03050;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      background-image:
        radial-gradient(at 20% 15%, rgba(24,160,88,.13) 0px, transparent 55%),
        radial-gradient(at 82% 78%, rgba(32,128,240,.11) 0px, transparent 55%);
      padding: 24px;
      color: var(--text);
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,.09), 0 2px 8px rgba(0,0,0,.04);
      padding: 40px 36px 32px;
      animation: rise .45s cubic-bezier(.2,.8,.25,1);
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--brand), #36ad6a);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px;
      box-shadow: 0 6px 18px rgba(24,160,88,.3);
    }
    .logo svg { width: 28px; height: 28px; stroke: #fff; }

    h1 { font-size: 21px; font-weight: 600; text-align: center; letter-spacing: .2px; }
    .sub { font-size: 13px; color: var(--muted); text-align: center; margin-top: 7px; }

    .form { margin-top: 30px; }

    .field { margin-bottom: 18px; }
    label {
      display: block; font-size: 13px; font-weight: 500;
      color: #374151; margin-bottom: 7px;
    }
    .input-wrap { position: relative; }
    input {
      width: 100%;
      height: 42px;
      padding: 0 13px;
      font-size: 14.5px;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      transition: border-color .18s, box-shadow .18s;
      font-family: inherit;
    }
    input:hover { border-color: #cbd5e1; }
    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(24,160,88,.13);
    }
    input::placeholder { color: #9ca3af; }

    .toggle-pwd {
      position: absolute; right: 8px; top: 50%;
      transform: translateY(-50%);
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      border: 0; background: transparent; cursor: pointer;
      border-radius: 6px; color: #9ca3af;
    }
    .toggle-pwd:hover { background: #f3f4f6; color: #4b5563; }
    .toggle-pwd svg { width: 17px; height: 17px; }

    .row {
      display: flex; align-items: center; justify-content: space-between;
      margin: -4px 0 20px;
      font-size: 13px;
    }
    .remember {
      display: flex; align-items: center; gap: 7px;
      color: #4b5563; cursor: pointer; user-select: none;
    }
    .remember input {
      width: 15px; height: 15px; accent-color: var(--brand);
      cursor: pointer; margin: 0;
    }

    .btn {
      width: 100%; height: 43px;
      border: 0; border-radius: 9px;
      background: var(--brand);
      color: #fff; font-size: 15px; font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background .18s, transform .1s, box-shadow .18s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:hover:not(:disabled) { background: var(--brand-dark); }
    .btn:active:not(:disabled) { transform: scale(.985); }
    .btn:disabled { opacity: .62; cursor: not-allowed; }

    .spinner {
      width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn.loading .spinner { display: block; }
    .btn.loading .btn-text { opacity: .85; }

    .alert {
      display: none;
      align-items: flex-start; gap: 9px;
      padding: 11px 13px;
      margin-bottom: 18px;
      border-radius: 9px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      font-size: 13.5px;
      line-height: 1.5;
    }
    .alert.show { display: flex; }
    .alert svg { width: 16px; height: 16px; flex: 0 0 auto; margin-top: 1px; }

    .foot {
      margin-top: 26px; padding-top: 18px;
      border-top: 1px solid #f1f3f5;
      text-align: center; font-size: 12px; color: #9ca3af;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 8V4H8" />
        <rect width="16" height="12" x="4" y="8" rx="2" />
        <path d="M2 14h2M20 14h2M15 13v2M9 13v2" />
      </svg>
    </div>

    <h1>LangGraph 智能体</h1>
    <p class="sub">请登录以继续使用</p>

    <form class="form" id="form" autocomplete="on">
      <div class="alert" id="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" /><path d="M12 8v4M12 16h.01" />
        </svg>
        <span id="alert-text"></span>
      </div>

      <div class="field">
        <label for="username">用户名</label>
        <div class="input-wrap">
          <input type="text" id="username" name="username"
                 placeholder="请输入用户名" autocomplete="username"
                 autocapitalize="off" autocorrect="off" spellcheck="false" required />
        </div>
      </div>

      <div class="field">
        <label for="password">密码</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password"
                 placeholder="请输入密码" autocomplete="current-password" required />
          <button type="button" class="toggle-pwd" id="toggle" aria-label="显示密码">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </div>

      <div class="row">
        <label class="remember">
          <input type="checkbox" id="remember" />
          <span>记住我（7 天）</span>
        </label>
      </div>

      <button type="submit" class="btn" id="submit">
        <span class="spinner"></span>
        <span class="btn-text">登 录</span>
      </button>
    </form>

    <div class="foot">
      登录状态通过 HttpOnly Cookie 维持<br />
      LangGraph Server Agent
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const form = $('form'), btn = $('submit'), alertBox = $('alert'), alertText = $('alert-text');
    const usernameEl = $('username'), passwordEl = $('password'), rememberEl = $('remember');

    // 若已登录则直接进入主应用
    fetch('/api/auth/check', { credentials: 'same-origin' })
      .then(r => r.json())
      .then(d => { if (d.authenticated) location.replace('/'); })
      .catch(() => {});

    // 记住上次用户名
    try {
      const saved = localStorage.getItem('lg_user');
      if (saved) { usernameEl.value = saved; rememberEl.checked = localStorage.getItem('lg_remember') === '1'; }
    } catch (e) {}

    // 密码可见性切换
    $('toggle').addEventListener('click', () => {
      const show = passwordEl.type === 'password';
      passwordEl.type = show ? 'text' : 'password';
      $('toggle').setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
      $('toggle').style.color = show ? '#18a058' : '';
      passwordEl.focus();
    });

    function showError(msg) {
      alertText.textContent = msg;
      alertBox.classList.add('show');
    }
    function clearError() { alertBox.classList.remove('show'); }

    [usernameEl, passwordEl].forEach(el =>
      el.addEventListener('input', clearError));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const username = usernameEl.value.trim();
      const password = passwordEl.value;
      if (!username || !password) { showError('请填写用户名和密码'); return; }

      btn.disabled = true;
      btn.classList.add('loading');
      $('submit').querySelector('.btn-text').textContent = '登录中';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password, remember: rememberEl.checked }),
        });
        let data = {};
        try { data = await res.json(); } catch (_) {}

        if (res.ok && data.ok) {
          try {
            if (rememberEl.checked) {
              localStorage.setItem('lg_user', username);
              localStorage.setItem('lg_remember', '1');
            } else {
              localStorage.removeItem('lg_user');
              localStorage.removeItem('lg_remember');
            }
          } catch (_) {}
          location.replace('/');
          return;
        }

        showError(data.error ||
          (res.status === 429 ? '尝试过于频繁，请稍后再试' : '用户名或密码错误'));
      } catch (err) {
        showError('网络异常，请检查连接后重试');
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
        $('submit').querySelector('.btn-text').textContent = '登 录';
      }
    });

    // 自动聚焦
    (usernameEl.value ? passwordEl : usernameEl).focus({ preventScroll: true });
  </script>
</body>
</html>
